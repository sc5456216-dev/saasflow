{% extends "base.html" %}
{% block content %}
<div class="profile-container">
    <div class="profile-header">
        <h1>Edit Profile</h1>
        <a href="{% url 'profile' %}" class="btn-secondary">← Back to Profile</a>
    </div>
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    
    <div class="profile-card">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" value="{{ user.first_name }}">
            </div>
            
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" value="{{ user.last_name }}">
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ user.email }}" required>
            </div>
            
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" value="{{ profile.phone }}">
            </div>
            
            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" value="{{ profile.location }}">
            </div>
            
            <div class="form-group">
                <label>Bio</label>
                <textarea name="bio" rows="4" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;">{{ profile.bio }}</textarea>
            </div>
            
            <div class="form-group">
                <label>Avatar</label>
                <input type="file" name="avatar" accept="image/*">
                {% if profile.avatar %}
                    <p style="margin-top: 5px; color: #666;">Current: {{ profile.avatar.name }}</p>
                {% endif %}
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%;">Save Changes</button>
        </form>
    </div>
</div>

<style>
    .profile-container { max-width: 800px; margin: 100px auto 40px; padding: 0 20px; }
    .profile-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .profile-header h1 { font-size: 32px; }
    .profile-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
    .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    .btn-primary { padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; }
    .btn-primary:hover { background: #764ba2; }
    .btn-secondary { padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 8px; }
    .btn-secondary:hover { background: #5a6268; }
    .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; }
    .alert-success { background: #d4edda; color: #155724; }
    .alert-error { background: #f8d7da; color: #721c24; }
</style>
{% endblock %}
