{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h2>Login to SaaSFlow</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>
            </div>
            <button type="submit" class="btn-primary">Login</button>
            <input type="hidden" name="next" value="{{ next|default:'/dashboard/' }}">
        </form>
        
        <div class="auth-links">
            <p class="auth-link">
                Don't have an account? <a href="{% url 'register' %}">Register Here</a>
            </p>
            <p class="auth-link">
                <a href="{% url 'password_reset' %}">Forgot Password?</a>
            </p>
        </div>
        
        <!-- Return to Shop link -->
        <div class="mt-4 text-center">
            <a href="{% url 'product_list' %}" class="text-[#667eea] hover:text-[#764ba2]">
                <i class="fas fa-arrow-left mr-1"></i> Continue Shopping
            </a>
        </div>
    </div>
</div>

<style>
    .auth-container { 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh; 
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
        padding: 20px; 
    }
    .auth-box { 
        background: white; 
        padding: 40px; 
        border-radius: 16px; 
        max-width: 400px; 
        width: 100%; 
        box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
    }
    .auth-box h2 { 
        margin-bottom: 20px; 
        text-align: center; 
        color: #333; 
    }
    .form-group { 
        margin-bottom: 20px; 
    }
    .form-group label { 
        display: block; 
        margin-bottom: 5px; 
        font-weight: 500; 
        color: #555; 
    }
    .form-group input { 
        width: 100%; 
        padding: 12px; 
        border: 1px solid #ddd; 
        border-radius: 8px; 
        font-size: 16px; 
        box-sizing: border-box; 
    }
    .form-group input:focus { 
        outline: none; 
        border-color: #667eea; 
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); 
    }
    .auth-box .btn-primary { 
        width: 100%; 
        padding: 14px; 
        background: #667eea; 
        color: white; 
        border: none; 
        border-radius: 8px; 
        font-size: 16px; 
        font-weight: 600; 
        cursor: pointer; 
        transition: background 0.3s; 
    }
    .auth-box .btn-primary:hover { 
        background: #764ba2; 
    }
    .auth-link { 
        text-align: center; 
        margin-top: 12px; 
        color: #666; 
        font-size: 14px;
    }
    .auth-link a { 
        color: #667eea; 
        text-decoration: none; 
        font-weight: 500;
    }
    .auth-link a:hover { 
        text-decoration: underline; 
    }
    .auth-links {
        margin-top: 20px;
        border-top: 1px solid #eee;
        padding-top: 20px;
    }
    .alert { 
        padding: 12px; 
        border-radius: 8px; 
        margin-bottom: 20px; 
    }
    .alert-success { 
        background: #d4edda; 
        color: #155724; 
        border: 1px solid #c3e6cb; 
    }
    .alert-error { 
        background: #f8d7da; 
        color: #721c24; 
        border: 1px solid #f5c6cb; 
    }
    .alert-info { 
        background: #d1ecf1; 
        color: #0c5460; 
        border: 1px solid #bee5eb; 
    }
    .alert-warning { 
        background: #fff3cd; 
        color: #856404; 
        border: 1px solid #ffeeba; 
    }
    
    .dark .auth-box {
        background: #1e1e32;
    }
    .dark .auth-box h2 {
        color: #e0e0e0;
    }
    .dark .form-group label {
        color: #a0aec0;
    }
    .dark .form-group input {
        background: #2d2d44;
        border-color: #444466;
        color: #e0e0e0;
    }
    .dark .auth-link {
        color: #a0aec0;
    }
    .dark .auth-links {
        border-top-color: #2d2d44;
    }
</style>
{% endblock %}
