{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h2>Reset Password</h2>
        <p style="color: #666; margin-bottom: 20px;">Enter your email address and we'll send you a link to reset your password.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <button type="submit" class="btn-primary">Send Reset Link</button>
        </form>
        <p class="auth-link"><a href="{% url 'login' %}">Back to Login</a></p>
    </div>
</div>
<style>
    .auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
    .auth-box { background: white; padding: 40px; border-radius: 16px; max-width: 400px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .auth-box h2 { margin-bottom: 20px; text-align: center; color: #333; }
    .form-group { margin-bottom: 20px; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    .auth-box .btn-primary { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .auth-box .btn-primary:hover { background: #764ba2; }
    .auth-link { text-align: center; margin-top: 20px; }
</style>
{% endblock %}
