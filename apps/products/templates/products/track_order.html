{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-8 mt-16 max-w-2xl">
    <h1 class="text-3xl font-bold dark:text-white mb-8">Track Your Order</h1>
    
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
        <p class="text-gray-600 dark:text-gray-400 mb-6">
            Enter your order number to track your shipment.
        </p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <label class="block dark:text-gray-300 mb-2">Order Number</label>
                    <input type="text" name="order_number" placeholder="e.g. ORD-ABCD1234" 
                           class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:text-white dark:border-gray-600">
                </div>
                <div class="flex items-end">
                    <button type="submit" class="btn-primary">Track Order</button>
                </div>
            </div>
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-500 dark:text-gray-400">
                Don't have an order number? <a href="{% url 'order_history' %}" class="text-[#667eea] hover:underline">View your order history</a>
            </p>
        </div>
    </div>
</div>

<style>
    .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; }
    .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
</style>
{% endblock %}
