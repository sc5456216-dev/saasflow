{% extends "base.html" %}
{% block content %}
<div class="dashboard-container">
    <div class="dashboard-header">
        <h1>Create Your Company</h1>
        <a href="{% url 'dashboard' %}" class="btn-secondary">← Back to Dashboard</a>
    </div>
    
    <div class="auth-container" style="min-height: auto; padding: 20px 0;">
        <div class="auth-box" style="max-width: 500px;">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
            
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Company Name *</label>
                    <input type="text" name="name" placeholder="Enter your company name" required>
                </div>
                <div class="form-group">
                    <label>Website (optional)</label>
                    <input type="url" name="website" placeholder="https://yourcompany.com">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Create Company</button>
            </form>
        </div>
    </div>
</div>

<style>
    .dashboard-container { max-width: 1200px; margin: 100px auto 40px; padding: 0 20px; }
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .dashboard-header h1 { font-size: 32px; }
    .btn-secondary { padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 8px; }
    .btn-secondary:hover { background: #5a6268; }
    .auth-container { min-height: auto; padding: 20px 0; }
    .auth-box { background: white; padding: 40px; border-radius: 16px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; }
    .alert-success { background: #d4edda; color: #155724; }
    .alert-error { background: #f8d7da; color: #721c24; }
    .alert-info { background: #d1ecf1; color: #0c5460; }
</style>
{% endblock %}
