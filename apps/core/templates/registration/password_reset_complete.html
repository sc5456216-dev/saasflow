{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h2>✅ Password Reset Complete</h2>
        <p style="color: #666; margin: 20px 0;">Your password has been successfully reset.</p>
        <a href="{% url 'login' %}" class="btn-primary" style="display: inline-block; text-align: center; text-decoration: none; width: 100%;">Login Now</a>
    </div>
</div>

<style>
    .auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
    .auth-box { background: white; padding: 40px; border-radius: 16px; max-width: 400px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .auth-box h2 { margin-bottom: 20px; text-align: center; color: #333; }
    .auth-box .btn-primary { display: inline-block; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; width: 100%; text-align: center; }
    .auth-box .btn-primary:hover { background: #764ba2; }
</style>
{% endblock %}
